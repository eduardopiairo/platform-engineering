# Argo CD overrides for the local Docker Desktop cluster.
# Upstream chart: argo/argo-cd 10.9.2 (Argo CD v3.5.3)
#
# Install / upgrade:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm upgrade --install argocd argo/argo-cd --version 10.9.2 \
#     -n argocd --create-namespace -f demo-app/charts/argocd/values.yaml
#
# Access the UI:
#   kubectl -n argocd port-forward svc/argocd-server 8080:80
#   open http://localhost:8080  (user: admin)
#   kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d

global:
  domain: localhost

configs:
  params:
    # Serve the UI/API over plain HTTP; TLS is unnecessary behind a local port-forward
    server.insecure: true

# SSO is not needed locally; log in with the built-in admin user
dex:
  enabled: false

# No notification targets (Slack, email, ...) configured yet
notifications:
  enabled: false
