name: Build Demo App

# Builds the demo-app image as 0.0.<run number>, pushes it to Docker Hub, and
# commits that version to appVersion in demo-app/charts/demo-app/Chart.yaml so
# Argo CD deploys it.

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - demo-app/src/**
      - demo-app/Dockerfile
      - demo-app/.dockerignore
      - demo-app/requirements.txt
      - .github/workflows/demo-app-build.yml
  pull_request:
    branches:
      - main
    paths:
      - demo-app/src/**
      - demo-app/Dockerfile
      - demo-app/.dockerignore
      - demo-app/requirements.txt
      - .github/workflows/demo-app-build.yml
  workflow_dispatch:

# One build per branch at a time, so version commits land in order
concurrency:
  group: demo-app-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: edpiairo/demo-app
  CHART: demo-app/charts/demo-app/Chart.yaml
  APP_VERSION: 0.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to commit the new appVersion back to the branch
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: demo-app
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.APP_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs only after the image is pushed, so Argo CD never deploys a missing tag.
      # Commits made with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop.
      - name: Commit new appVersion to Chart.yaml
        if: github.event_name != 'pull_request'
        run: |
          sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "$CHART"
          if git diff --quiet "$CHART"; then
            echo "appVersion is already ${APP_VERSION}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART"
          git commit -m "chore(demo-app): release ${APP_VERSION} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
